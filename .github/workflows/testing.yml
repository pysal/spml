---
name: Continuous Integration

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "59 23 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Manual CI Run
        default: test
        required: false

jobs:
  tests:
    name: ${{ matrix.os }}, ${{ matrix.environment-file }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment-file:
          [
            py312_oldest,
            py312_latest,
            py313_min,
            py313_latest,
            py314_latest,
            py314_dev,
          ]
        include:
          - environment-file: py314_latest
            os: macos-latest # Apple Silicon
          - environment-file: py314_latest
            os: windows-latest
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags.
          persist-credentials: false

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ci/${{ matrix.environment-file }}.yaml
          micromamba-version: "latest"

      - name: install package
        run: "pip install -e . --no-deps"

      - name: spatial versions
        run: 'python -c "import geopandas; geopandas.show_versions();"'

      - name: Download test files
        run: |
          python -c '
          import geodatasets

          geodatasets.fetch("geoda guerry")
          '

      - name: Set OpenMP threads
        if: matrix.os == 'windows-latest'
        run: echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"

      - name: run tests
        run: |
          pytest \
          spml/ \
          --verbose \
          -r a \
          --numprocesses logical \
          --color yes \
          --cov spml \
          --cov-append \
          --cov-report term-missing \
          --cov-report xml . \

      - name: doctest
        if: contains(matrix.environment-file, 'latest') && contains(matrix.os, 'ubuntu')
        run: |
          pytest -v --color=yes --doctest-only spml

      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
