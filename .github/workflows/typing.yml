---
name: Typing

permissions: {}

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - "*"
    schedule:
        - cron: "59 23 * * 3"
    workflow_dispatch:
        inputs:
            version:
                description: Manual CI Run
                default: test
                required: false

jobs:
    ty-check:
        name: Type checking
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3

            - name: Install spml
              run: |
                  uv venv
                  uv pip install ty
                  uv pip install .[optional]

            - name: Run checks
              run: uv run ty check spml --output-format github
