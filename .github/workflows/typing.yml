---
name: Type checking

permissions: {}

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "0 0 * * 1,4"
  workflow_dispatch:
    inputs:
      version:
        description: Manual test execution
        default: test
        required: false

jobs:
  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags.
          persist-credentials: false

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: ci/py314_latest.yaml
          create-args: >-
            mypy

      - name: Install spml
        run: pip install .

      - name: Check spml
        run: |
            mypy spml/ \
            --install-types \
            --ignore-missing-imports \
            --non-interactive
