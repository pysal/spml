---
name: Typing

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - "*"
    schedule:
        - cron: "59 23 * * *"
    workflow_dispatch:
        inputs:
            version:
                description: Manual CI Run
                default: test
                required: false

jobs:
    ty-check:
        name: Type checking
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

            - name: Install spml
              run: |
                  uv venv
                  uv pip install ty
                  uv pip install .[optional]

            - name: Run checks
              run: uv run ty check spml
